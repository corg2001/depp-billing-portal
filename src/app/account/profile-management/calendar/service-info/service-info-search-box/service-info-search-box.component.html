<div id="container">
  <form [formGroup]="calendarForm">
    <div class="form-group" (change)="stateSearch(calendarForm)">
      <select id="state" formControlName="state" class="form-control">
        <option value="" disabled selected>Select state</option>
        <option *ngFor="let state of stateCodes" value="{{ state }}">{{ state }}</option>
      </select>
    </div>
    <div class="form-group" (change)="tradeSearch(calendarForm)">
      <select id="trade" formControlName="trade" class="form-control">
        <option value="" disabled selected>Select trade</option>
        <option *ngFor="let trade of trades" value="{{ trade }}">{{ trade }}</option>
      </select>
    </div>
  </form>
</div>
