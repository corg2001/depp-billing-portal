<div id="container">
  <div class="calendar">
    <app-calendar-info (dateChange)="handleDateChange($event)"></app-calendar-info>
  </div>

  <ng-container>
    <div class="service-info" >
      <app-service-info [calendarDate]="calendarDate" [tradeDetails$]="tradeDetails$" [loading]="loading"></app-service-info>
    </div>
  </ng-container>
</div>
