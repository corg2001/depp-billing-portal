<div id="container">
  <select id="state">
    <option value="" disabled selected>Select state</option>
    <option *ngFor="let state of stateCodes" value="{{ state }}">{{
      state
    }}</option>
  </select>
  <select id="trade">
    <option value="" disabled selected>Select trade</option>
    <option *ngFor="let trade of trades" value="{{ trade }}">{{
      trade
    }}</option>
  </select>
</div>
