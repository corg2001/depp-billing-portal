<div class="header-txt">Welcome <label *ngIf="name" for="name">, {{name}}</label></div>
<div class="d-flex profile-mgnt">
  <div class="left-nav-bar">
    <div class="d-flex" [ngClass]="{'left-nav-bar-items': item === profileManagementTypes.BusinessInfo}"
      (click)="gotoSections(profileManagementTypes.BusinessInfo)">Business Info</div>
  </div>
  <div class="profile-content">
    <app-business-info *ngIf="item === profileManagementTypes.BusinessInfo"></app-business-info>
    <app-ach-documents [achDocs]="achDocs" [completion]="achDocsCompletion" [error]="achDocsError"
      *ngIf="item === profileManagementTypes.Documents"></app-ach-documents>
    <app-agreed-rates [agreedRates]="agreedRates" [completion]="agreedRatesCompletion" [error]="agreedRatesError"
      *ngIf="item === profileManagementTypes.AgreedRates"></app-agreed-rates>
    <app-service-areas [serviceAreas]="serviceAreas" [error]="serviceAreasError" [completion]="serviceAreasCompletion"
      [errorMessage]="serviceAreasErrorMessage" *ngIf="item === profileManagementTypes.ServiceArea"></app-service-areas>
    <app-calendar *ngIf="item === profileManagementTypes.Calender"></app-calendar>
  </div>
</div>
