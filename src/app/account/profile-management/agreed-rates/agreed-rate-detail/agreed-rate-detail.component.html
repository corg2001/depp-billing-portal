<div>
    <div class="d-flex profile-info-details mt-4 ml-2">
      <div class="info-rates">
        <span class="profile-agreed-rates">{{ companyName }}</span>
      </div>
      <div class="pl-3 pr-3 ml-auto">
        Contractor ID: <span class="profile-agreed-rates">{{ partyId }}</span>
      </div>
    </div>
    <div class="profile-details ml-2">
      <div class="d-flex agreed-rates pb-3 ml-2">
        <div class="info-rates">
          <span class="profile-agreed-rates">Rate Code</span>
        </div>
        <div class="pl-3 pr-3 ml-auto">
          <span class="profile-agreed-rates">Agreed Rate</span>
        </div>
      </div>
      <div class="d-flex agreed-rates-info" *ngFor="let agreedRate of rateDetails">
        <div class="work-time info-rates ml-2"><span>{{ agreedRate.description}}</span></div>
        <div class="pr-3 ml-auto">
          <span>{{ agreedRate?.rate.amount | formatmoney }} per hour</span>
        </div>
      </div>
    </div>
  </div>
