<form [formGroup]="searchForm" (ngSubmit)="search(searchForm)">
  <div class="d-flex flex-column flex-md-row w-70">
    <div class="form-group" (change)="updateServiceDetails($event)">
      <select id="county" formControlName="county" class="form-control">
        <option value="" disabled selected>Select your county</option>
         <option *ngFor="let name of countyNames" value="{{name}}">{{ name }}</option>
        </select>
        <!-- <input type="text" id="county" name="county" class="form-control" placeholder="County"
        formControlName="county" /> -->
    </div>
    <div class="form-group">
      <input type="text" id="zip-pcode" name="zip-pcode" class="form-control" placeholder="ZIP Code"
        formControlName="zipcode" />
    </div>
    <div class="form-group">
      <select id="skillType" formControlName="skillType" class="form-control">
          <option value="" disabled selected>Select trade</option>
          <option *ngFor="let trade of skillTypesList" value="{{ trade }}">{{ trade }}</option>
        
      </select>
    </div>
    <div class="form-group">
      <button type="submit" class="btn btn-secondary">
        <i class="fa fa-search" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</form>
