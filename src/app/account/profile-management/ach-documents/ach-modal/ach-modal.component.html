
<div class="modal-header">
    <button type="button" class="close" aria-label="Close" (click)="close()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
<div class="modal-body">
  <input #file type="file" (change)="onFilesAdded($event)" />
  <div class="browse">
    <div class="title">Upload Documents</div>
    <button [disabled]="uploading || uploadSuccessful" (click)="addFiles()">
      {{ browseButtonText }}
    </button>
    <div>
      <div class="files" *ngFor="let file of files">
        <div class="file-text">{{ file.name }}</div>
        <app-progress-bar class="progress" [value]="progress$[file.name].progress | async">
        </app-progress-bar>
      </div>
    </div>
  </div>
</div>
