<div id="help-context" class="w-100 text-center">
  <div class="container help-container">
      <div class="text-center header-txt mb-4">Reach Out to Us</div>
      <div class="text-center mb-5">Please email us with any questions you may have. We will get back to you within 24 hours.</div>
      <div>
          <form [formGroup]="helpFormGroup" (ngSubmit)="sendHelpContent()">

              <div class="d-flex justify-content-center mb-1">
                  <div class="form-group mr-2 name-email">
                      <input type="text" id="help-name" name="name" class="form-control" placeholder="Name" formControlName="name" />
                  </div>
                    <div class="form-group name-email">
                      <input type="text" id="help-email" name="email" class="form-control" placeholder="Email" formControlName="email"/>
                    </div>
              </div>
              <div class="d-flex justify-content-center mb-1">
                  <div class="form-group mr-2 txt-phone">
                      <input type="text" id="help-name" name="phone" class="form-control" placeholder="Phone" formControlName="phoneNumber" />
                    </div>
                    <div class="form-group mr-2" style="width:191px">
                      <select class="form-control" name="office" id="" formControlName="phoneType">
                        <option value="">Phone Number Type</option>
                        <option value="office">Office</option>
                        <option value="mobile">Mobile</option>
                      </select>
                    </div>
                    <div class="form-group mr-2">
                        <input type="text" id="help-email" name="city" class="form-control" placeholder="City" formControlName="city"/>
                    </div>
                    <div class="form-group" style="width:127px">
                        <select class="form-control" name="state" id="" formControlName="state">
                          <option value="">State</option>
                          <option *ngFor="let state of states">{{state}}</option>
                        </select>
                    </div>
              </div>
              <div class="d-flex justify-content-center mb-1">
                  <div class="form-group">
                      <textarea name="helptext" cols="40" style="min-width: 810px;" rows="5" class="form-control help-textarea" placeholder="How can we help?" formControlName="content"></textarea>
                      <!-- <input type="text" id="help-name" name="helptxt" class="form-control" placeholder="How can we help?" formControlName="content" /> -->
                    </div>
                   
              </div>
              <div class="d-flex justify-content-center mb-1">
                  <div class="form-group preferredmethod">
                      <select class="form-control" name="preferredmethod" id="" formControlName="preferredMethod">
                        <option value="">Preferred Method Of Contact</option>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                      </select>
                  </div>
              </div>
              <div class="d-flex justify-content-center">
               <div class="form-group">
                  <button type="submit" class="btn btn-secondary">SUBMIT
                  </button>
                </div>
              </div>
            </form>
      </div>
  </div>
</div>
