<div>
  <header>{{ headerText }}</header>
  <app-search (doSearch)="search($event.value)"></app-search>
  <app-loading-spinner *ngIf="loading && !error"></app-loading-spinner>
  <ng-container *ngIf="!loading && isData">
    <p>{{ historyMessage }}</p>
    <app-payment-table [paymentHistory$]="paymentHistory$"></app-payment-table>
  </ng-container>
  <ng-container *ngIf="(!isData && !loading) || error">
    <div>
      <p>{{ noInfoText }}</p>
    </div>
  </ng-container>
</div>
