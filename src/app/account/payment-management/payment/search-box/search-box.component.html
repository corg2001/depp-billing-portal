<div id="payment-search-box-conatiner" class="w-100 text-center">
  <form [formGroup]="searchForm" (ngSubmit)="search(searchForm)">
    <div class="d-flex flex-column flex-md-row w-70">
      <div class="form-group">
        <input
          type="text"
          class="form-control"
          id="byStartDate"
          name="byStartDate"
          placeholder="By Start Date"
          formControlName="startDate"
        />
      </div>
      <div class="form-group">
        <input
          type="text"
          class="form-control"
          id="byEndtDate"
          name="byEndtDate"
          placeholder="By End Date"
          formControlName="endtDate"
        />
      </div>
      <div class="form-group">
        <input
          type="text"
          class="form-control"
          id="byRefId"
          name="byRefId"
          placeholder="By Reference ID"
          formControlName="referenceId"
        />
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-secondary">
          <i class="fa fa-search" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </form>
</div>
