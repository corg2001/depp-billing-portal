<div [formGroup]="diagnosisForm">
  <div formGroupName="currentUnitInfo">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="brand">Brand:</label>
        <input type="text" class="form-control" id="brand" formControlName="brand">
      </div>
      <div class="form-group col-md-6">
        <label for="modelNumber">Model Number:</label>
        <input type="text" class="form-control" id="modelNumber" formControlName="modelNumber">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="serialNumber">Serial Number:</label>
        <input type="text" class="form-control" id="serialNumber" formControlName="serialNumber">
      </div>
      <div class="form-group col-md-6">
        <label for="age">Age:</label>
        <input type="text" class="form-control" id="age" formControlName="age">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="condition">Condition:</label>
        <input type="text" class="form-control" id="condition" formControlName="condition">
      </div>
    </div>
  </div>
</div>
