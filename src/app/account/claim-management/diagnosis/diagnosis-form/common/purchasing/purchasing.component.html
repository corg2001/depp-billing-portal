<div class="sub-title">
  Purchasing
</div>
<div [formGroup]="diagnosisForm">
  <div formGroupName="purchasingInfo">
    <div formArrayName="items">
      <div *ngFor="let item of items.controls; let i = index">
        <div [formGroupName]="i">
          <div class="row border-bottom my-2" *ngIf="i !== 0"></div>
          <div class="d-flex flex-row-reverse" *ngIf="i !== 0">
            <div (click)="removeItem(i)">
              <button type="button" class="btn-remove-item">
                <i class="fa fa-window-close fa-2x" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-6">
              <label for="partToOrder">Part to Order:</label>
              <input type="text" class="form-control" id="partToOrder" formControlName="partToOrder">
            </div>
            <div class="form-group col-md-6">
              <label for="partNumber">Part Number (#):</label>
              <input type="text" class="form-control" id="partNumber" formControlName="partNumber">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="add-another" (click)="addItem()">
      <button type="button" class="btn-add-another">
        <i class="fa fa-plus-circle fa-2x" aria-hidden="true"></i>
      </button>
      <span class="label-add-another">Add another part</span>
    </div>
    <div class="component-sub-header">
      Ship to Address
    </div>
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="address1">Address 1:</label>
        <input type="text" class="form-control" id="address1" formControlName="address1">
      </div>
      <div class="form-group col-md-6">
        <label for="address2">Address 2:</label>
        <input type="text" class="form-control" id="address2" formControlName="address2">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group col-md-4">
        <label for="city">City:</label>
        <input type="text" class="form-control" id="city" formControlName="city">
      </div>
      <div class="form-group col-md-4">
        <label for="state">State:</label>
        <input type="text" class="form-control" id="state" formControlName="state">
      </div>
      <div class="form-group col-md-4">
        <label for="zip">Zip:</label>
        <input type="text" class="form-control" id="zip" formControlName="zip">
      </div>
    </div>
  </div>
</div>
