<div [formGroup]="diagnosisForm">
  <div formGroupName="applianceTypeInfo">
    <div formGroupName="ventHood">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="vhWidth">Model number:</label>
          <input type="text" class="form-control" id="vhWidth" formControlName="width">
        </div>
        <div class="form-group col-md-6">
          <label for="vhNumberSpeeds">Serial number:</label>
          <input type="text" class="form-control" id="vhNumberSpeeds" formControlName="numberSpeeds">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="vhColor">Color:</label>
          <input type="text" class="form-control" id="vhColor" formControlName="color">
        </div>
      </div>
    </div>
  </div>
</div>
