<div [formGroup]="diagnosisForm">
  <div formGroupName="poolClaimInfo">
    <div formGroupName="poolSpa">
      <div class="form-row">
        <div class="form-group form-inline ml-1">
          <div class="option-group-label">
            Is equipment shared?
          </div>
          <div class="custom-control custom-radio custom-control-inline">
            <input type="radio" class="custom-control-input" name="isEquipmentShared" formControlName="isEquipmentShared" id="isEquipmentSharedYes" value="Yes">
            <label class="custom-control-label" for="isEquipmentSharedYes">Yes</label>
          </div>
          <div class="custom-control custom-radio custom-control-inline">
            <input type="radio" class="custom-control-input" name="isEquipmentShared" formControlName="isEquipmentShared" id="isEquipmentSharedNo" value="No">
            <label class="custom-control-label" for="isEquipmentSharedNo">No</label>
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group form-inline ml-1">
          <div class="option-group-label">
            Is pool/spa built in or freestanding?
          </div>
          <div class="custom-control custom-radio custom-control-inline">
            <input type="radio" class="custom-control-input" name="isBuiltInOrFreestanding" formControlName="isBuiltInOrFreestanding" id="bofBuiltIn" value="Built In">
            <label class="custom-control-label" for="bofBuiltIn">Built In</label>
          </div>
          <div class="custom-control custom-radio custom-control-inline">
            <input type="radio" class="custom-control-input" name="isBuiltInOrFreestanding" formControlName="isBuiltInOrFreestanding" id="bofFreestanding" value="Freestanding">
            <label class="custom-control-label" for="bofFreestanding">Freestanding</label>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
