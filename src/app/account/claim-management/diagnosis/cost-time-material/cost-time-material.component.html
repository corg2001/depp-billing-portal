<div class="sub-title">
  Cost - Time & Material
</div>
<div [formGroup]="diagnosisForm">
  <div formGroupName="costTimeMaterialInfo">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="laborHours">Labor (# of hours):</label>
        <input type="text" class="form-control" id="laborHours" formControlName="laborHours">
      </div>
      <div class="form-group col-md-6">
        <label for="rate">Rate ($):</label>
        <input currencyMask type="text" class="form-control" id="rate" formControlName="rate">
      </div>
    </div>
    <div class="component-sub-header">
      Tech Supplied Parts
    </div>
    <div formArrayName="items">
      <div *ngFor="let item of items.controls; let i = index">
        <div [formGroupName]="i">
          <div class="row border-bottom my-2" *ngIf="i !== 0"></div>
          <div class="d-flex flex-row-reverse" *ngIf="i !== 0">
            <div (click)="removeItem(i)">
              <button type="button" class="btn-remove-item">
                <i class="fa fa-window-close fa-2x" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="partName">Part name:</label>
              <input type="text" class="form-control" id="partName" formControlName="partName">
            </div>
            <div class="form-group col-md-4">
              <label for="partNumber">Part number:</label>
              <input type="text" class="form-control" id="partNumber" formControlName="partNumber">
            </div>
            <div class="form-group col-md-4">
              <label for="partPrice">Part price ($):</label>
              <input currencyMask type="text" class="form-control" id="partPrice" formControlName="partPrice">
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="add-another" (click)="addItem()">
      <button type="button" class="btn-add-another">
        <i class="fa fa-plus-circle fa-2x" aria-hidden="true"></i>
      </button>
      <span class="label-add-another">Add another part</span>
    </div>
    <div class="form-row align-items-center mb-2">
      <div class="label-total col-md-6">
        Tax ($)
      </div>
      <div class="col-md-6">
        <input currencyMask type="text" class="form-control" id="tax" formControlName="tax">
      </div>
    </div>
    <div class="form-row row-total align-items-center">
      <div class="label-total col-md-6">
        TOTAL
      </div>
      <div class="col-md-6">
        <input currencyMask type="text" class="form-control" id="total" formControlName="total">
      </div>
    </div>
  </div>

</div>
