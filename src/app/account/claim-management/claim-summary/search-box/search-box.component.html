<div id="claim-search-box-container" class="w-100 text-center">
  <form [formGroup]="searchForm" (ngSubmit)="search(searchForm)">
    <div class="d-flex flex-column flex-md-row w-70">
      <div class="form-group">
        <input type="text" id="by-name" name="by-name" class="form-control" placeholder="By name" formControlName="name" />
      </div>
      <div class="form-group">
        <input type="text" id="by-job-id" name="by-job-id" class="form-control" placeholder="By Job Id" formControlName="jobId"/>
      </div>
      <div class="form-group">
        <input type="text" id="by-address" name="by-address" class="form-control" placeholder="By Address" formControlName="address" />
      </div>
      <div class="form-group">
        <button type="submit" class="btn btn-secondary">
          <i class="fa fa-search" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </form>
</div>
