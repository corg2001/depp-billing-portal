<div id="claim-search-box-container" class="w-100 text-center">
  <form>
    <div class="d-flex flex-column flex-md-row justify-content-between">
      <div class="form-group">
        <input type="text" id="by-name" name="by-name" class="form-control" placeholder="By name" formControlName="byName" />
      </div>
      <div class="form-group">
        <input type="text" id="by-job-id" name="by-job-id" class="form-control" placeholder="By Job Id" />
      </div>
      <div class="form-group">
        <input type="text" id="by-address" name="by-address" class="form-control" placeholder="By Address" />
      </div>
      <div class="form-group">
        <button type="button" class="btn btn-secondary" (click)="search()">
          <i class="fa fa-search" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </form>
</div>
