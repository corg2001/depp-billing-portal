<div id="claim-summary-container" class="d-flex flex-column">
  <header class="header-txt">Welcome<label *ngIf="partyName !== null">, {{partyName}}</label>
  </header>
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>
  <div *ngIf="!loading"> 
    <app-claim-notification [claimSubject$]="claimList$" [searchedClaims$]="searchedClaim$"></app-claim-notification>
    <div class="claim-summary">
      <div class="activity">
        <span class="sub-title">{{ subTitleText1 }}</span>
        <span class="sub-title2">{{ subTitleText2 }}</span>
      </div>
      <div class="search-box">
        <app-search [allowFilter]="true" (doSearch)="search($event)" (doFilter)="filter($event)"></app-search>
      </div>
      <div>
        <app-claim-table [claimSubject$]="claimList$" [searchedClaimSubject$]="searchedClaim$"
          [completedSubject$]="completion$" [searchFormValue]="searchFormValues"></app-claim-table>
      </div>
    </div>
  </div>
</div>
