<table class="table table-striped">
    <thead>
      <tr>
        <th scope="col">Job ID</th>
        <th scope="col">Date</th>
        <th scope="col">Claim Order Type</th>
        <th scope="col">Claim Disposition</th>
        <th scope="col">Name</th>
        <th scope="col">Job Status</th>
        <th scope="col">Service Address</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor='let claim of modifiedClaims()' class="small">
        <td scope="row">{{ claim.jobNumber }}</td>
        <td scope="row">{{ claim.dateRequested | date }}</td>
        <td>{{ claim.claimType }}</td>
        <td>{{ claim.claimDisposition }}</td>
        <td>{{ claim.customerName }}</td>
        <td>{{ claim.jobStatus }}</td>
        <td>{{ claim.serviceAddress }}</td>
        <td><a class='text-uppercase' (click)="authorizeInvoice()">{{ authorizeInvoiceLinkText }}</a></td>
      </tr>
    </tbody>
  </table>
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>
<div>
  <ngb-pagination [pageSize]="pageSize" [(page)]="page" [collectionSize]="collectionSize" ></ngb-pagination>
  <!--
  <select [(ngModel)]="pageSize">
    <option *ngFor="let list of pageList" [ngValue]="list">{{list}} Items per page</option>
  </select>
  -->
</div>
