<div id="invoices-history-container" class="d-flex flex-column">
    <header>{{ headerText }}</header>
    <app-search [fromDate]="fromDate" [toDate]="toDate" (doSearch)="searchInvoices($event)"></app-search>
    <app-loading-spinner *ngIf="!completion" [message]=loadingMessage></app-loading-spinner>
    <ng-container *ngIf="!loading && isData">
        <app-invoice-table [invoiceData]="invoices" [error]="error" [completion]="completion"></app-invoice-table>
    </ng-container>
    <!--
  <ng-container *ngIf="(!loading && !isData) || error">
    <div>
      <p>{{ noInfoText }}</p>
    </div>
  </ng-container> -->
</div>
