<div class="jumbotron">
  <div class="card mx-auto col-12 col-md-8">
    <div class="card-body">
      <div class="flag card-text text-center">
        <!-- htmllint class-style="none" -->
        <i
          class="fa fa-paper-plane fa-2x text-blue px-2"
          aria-hidden="true"
          [ngClass]="{
            'text-success': resultStatus,
            'text-danger': !resultStatus
          }"
        ></i>
        <!-- htmllint class-style="$previous" -->
      </div>
      <div
        class="icon-subtitle card-text text-center"
      >{{ resultIconSubtitle }}</div>
      <hr class="wide" />
      <div class="result-title card-text text-center mb-3">
        <h1>{{ resultTitle }}</h1>
      </div>
      <div
        class="details-wrapper card-text text-center mt-2 mx-auto"
      >{{ resultDetails }}</div>
    </div>
  </div>
</div>
