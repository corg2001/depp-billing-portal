<div id="login-container">
  <div class="d-flex flex-column">
    <div class="header text-center mb-4">
      <div class="title text-primary">Sign in to manage your account</div>
    </div>
    <div class="tab-menu mb-4">
      <div class="d-flex flex-row justify-content-between align-content-center">
        <div class="item flex-fill bg-light">
          <a
            href="{{ siblingPortals.customer }}"
            target="_blank"
            alt="HWA Customer Portal"
            rel="noopener noreferrer"
            >Customer</a
          >
        </div>
        <div class="item flex-fill px-1 current">
          <a [routerLink]="'/'">Contractor</a>
        </div>
        <div class="item flex-fill bg-light">
          <a
            href="{{ siblingPortals.realtor }}"
            target="_blank"
            alt="HWA Realtor Portal"
            rel="noopener noreferrer"
            >Realtor</a
          >
        </div>
      </div>
    </div>
    <div class="login-form">
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group" (click)="resetResponseError()">
          <input
            type="email"
            id="username"
            class="form-control"
            alt="email"
            placeholder="Email Address"
            formControlName="userName"
            required
          />
          <div class="errors pt-1">
            <div
              *ngIf="
                !loginForm.get('userName').valid &&
                (loginForm.get('userName').dirty ||
                  loginForm.get('userName').touched)
              "
              class="text-danger small"
            >
              Please enter a valid email address.
            </div>
          </div>
        </div>
        <div class="form-group" (click)="resetResponseError()">
          <input
            type="password"
            id="password"
            class="form-control"
            alt="password"
            placeholder="Password"
            formControlName="userPassword"
            required
          />
          <div class="errors pt-1">
            <div
              class="text-danger small"
              *ngIf="
                !loginForm.get('userPassword').valid &&
                (loginForm.get('userPassword').dirty ||
                  loginForm.get('userPassword').touched)
              "
            >
              Please enter a valid password.
            </div>
          </div>
        </div>
        <div class="form-group small text-muted">
          By clicking "Sign In", you agree to the
          <a [routerLink]="" (click)="openTermsConditionsModal()"
            >Terms of Use</a
          >
          and
          <a [routerLink]="" (click)="openPrivacyPolicyModal()"
            >Privacy Policy</a
          >
          .
        </div>
        <div class="form-group text-center py-1">
          <button
            type="submit"
            id="form-submit-button"
            class="btn btn-submit-large"
            [disabled]="!loginForm.valid"
          >
            Sign In
          </button>
        </div>
        <div class="alert alert-danger" role="alert" *ngIf="showResponseError" [innerHTML]="responseErrorMessage">
        </div>
        <div *ngIf="showLoadingSpinner" class="form-group text-center py-1">
          <i class="fa fa-spinner fa-spin fa-2x fa-fw loading-spinner"></i>
          <span class="sr-only">Loading...</span>
        </div>
      </form>
    </div>
    <div class="footer small">
      <div><a routerLink="/auth/forgot-password">Forgot your password?</a></div>
      <div>
        Interested in becoming a DEPP technician?
        <a routerLink="/enroll">Click Here</a>
      </div>
    </div>
  </div>
</div>
