<div id="forgot-password-container">
  <div class="d-flex flex-column">
    <div id="header" class="mb-4 text-center">
      <div class="title text-primary" *ngIf="!isCompromised && !isSubmitted ">Forgot Password?</div>
      <div *ngIf="isCompromised" [innerHTML]="compromisedMsg"></div>
    </div>
    <div id="body pb-2" *ngIf="!isLoading">
      <ng-container *ngIf="!isSubmitted">
        <form [formGroup]="forgotPasswordForm">
          <div class="form-group">
            <label for="userEmail" class="d-block small">Please enter your email address and we'll send you a link to reset your password.</label>
            <input
              type="email"
              id="userEmail"
              name="userEmail"
              placeholder="Email Address"
              alt="user email"
              class="form-control"
              formControlName="userEmail"
            />
            <div class="errors small mt-1">
              <div
                class="text-danger"
                *ngIf="!forgotPasswordForm.get('userEmail').valid && (forgotPasswordForm.get('userEmail').dirty || forgotPasswordForm.get('userEmail').touched)"
              >
                Please provide a valid email address.
              </div>
            </div>
          </div>
          <div class="text-center mt-4">
            <button
              type="button"
              class="btn btn-submit-large text-uppercase"
              [disabled]="!forgotPasswordForm.valid"
              (click)="forgotPassword()"
            >
              Reset password
            </button>
          </div>
        </form>
      </ng-container>
      <div id="success-message" class="pb-3 small text-center" *ngIf="isSubmitted && isUserFound">
        <div>
          <p class="description text-center" [innerHTML]="responseMsg"></p>
        </div>
      </div>
      <div id="success-message" class="pb-3 small text-center" *ngIf="this.isSubmitted && !isUserFound">
        <div>
          <p class="description text-center" [innerHTML]=" responseMsg"></p>
        </div>
      </div>
      <div class="text-center small mt-2"><a routerLink="/auth/login">Go back to login</a></div>
    </div>
    <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>
  </div>
</div>
