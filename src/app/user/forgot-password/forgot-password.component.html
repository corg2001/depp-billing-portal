<div id="forgot-password-container">
  <div class="d-flex flex-column">
    <div id="header" class="mb-4 text-center">
      <div class="title text-primary">Forgot Password?</div>
    </div>
    <div id="body">
      <form [formGroup]="resetForm">
        <div class="form-group">
          <label for="userEmail" class="d-block small">Please enter your email address:</label>
          <input
            type="email"
            id="userEmail"
            name="userEmail"
            placeholder="email"
            alt="user email"
            class="form-control"
            formControlName="userEmail"
          />
          <div class="errors small mt-1">
            <div
              class="text-danger"
              *ngIf="!resetForm.get('userEmail').valid && (resetForm.get('userEmail').dirty || resetForm.get('userEmail').touched)"
            >
              Please provide a valid email address.
            </div>
          </div>
        </div>
        <div class="text-center mt-4">
          <button type="button" class="btn btn-submit-large" [disabled]="!resetForm.valid">Submit</button>
          <div class="text-center small mt-2"><a routerLink="/user/login">Go back to login</a></div>
        </div>
      </form>
    </div>
    <div id="footer" class="small mt-3">
      <div class="text-dark footer-label">Still having trouble?</div>
      <div>Call us at <span class="phone">(888) 492-7359</span> and we can help you log back in.</div>
    </div>
  </div>

</div>
