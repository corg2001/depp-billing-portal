<div id="login-container">
  <div class="d-flex flex-column">
    <div class="header text-center mb-4">
      <div class="title text-primary">Sign in to manage your account</div>
    </div>
    <div class="tab-menu mb-4">
      <div class="d-flex flex-row justify-content-around">
        <div class="bg-light py-1">Customer</div>
        <div class="bg-light py-1">Contractor</div>
        <div class="bg-light py-1">Real State</div>
      </div>
    </div>
    <div class="login-form">
      <form [formGroup]="loginForm">
        <div class="form-group">
          <input type="email" id="username" class="form-control" alt="email" placeholder="Email Address" formControlName="userName" />
          <div class="errors pt-1">
            <div
              *ngIf="!loginForm.get('userName').valid && (loginForm.get('userName').dirty || loginForm.get('userName').touched)"
              class="text-danger small"
            >
              Please enter a valid email address.
            </div>
          </div>
        </div>
        <div class="form-group">
          <input type="password" id="password" class="form-control" alt="password" placeholder="Password" formControlName="userPassword" />
          <div class="errors pt-1">
            <div
              class="text-danger small"
              *ngIf="!loginForm.get('userPassword').valid && (loginForm.get('userPassword').dirty || loginForm.get('userPassword').touched)"
            >
              Please enter a valid password.
            </div>
          </div>
        </div>
        <div class="form-group small text-muted">
          By clicking, I agree to the
          <a [routerLink]="" (click)="openTermsConditionsModal()">Terms of Use</a>
          and
          <a [routerLink]="" (click)="openPrivacyPolicyModal()">Privacy Policy</a> .
        </div>
        <div class="form-group text-center py-1">
          <button
            type="button"
            id="form-submit-button"
            class="btn btn-submit-large"
            [disabled]="!loginForm.valid"
            (click)="login()"
          >
            Sign In
          </button>
        </div>
      </form>
    </div>
    <div class="footer small">
      <div><a routerLink="/user/forgot-password">Forgot your password?</a></div>
      <div>Dont have a contractor account? <a routerLink="/user/lead">Enrol Now</a></div>
    </div>
  </div>
</div>
