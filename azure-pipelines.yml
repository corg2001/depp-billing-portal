- stage: BuildDev
  condition: eq(variables.isMasterBranch, true)
  # condition: and(succeeded('SonarCloudScan'), eq(variables.isMasterBranch, true))
  # dependsOn:
  # - SonarCloudScan
  jobs:
  - job: BuildDev
    pool:
      vmImage: ubuntu-20.04
    steps:
    - checkout: self
    - checkout: configuration
    - task: NodeTool@0
      displayName: 'Install NodeJS version $(nodeVersion)'
      inputs:
        versionSpec: $(nodeVersion)
    - script: |
        cp $(Agent.BuildDirectory)/s/unify-configs/$(devConfig) src/environments/environment.prod.ts
        npm install
        ./node_modules/.bin/ng build --prod --aot --build-optimizer
      workingDirectory: $(Agent.BuildDirectory)/s/depp-billing-portal
      displayName: Building dev portal
    - task: CopyFiles@2
      inputs:
        sourceFolder: $(Agent.BuildDirectory)/s/depp-billing-portal/dist/hwa-contractor
        targetFolder: $(Build.ArtifactStagingDirectory)/$(devArtifact)
      displayName: Copy Dev package
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(devArtifact)
        artifactName: $(devArtifact)
      displayName: Publish Dev artifact
- stage: DeployDev
  condition: and(succeeded('BuildDev'), eq(variables.isMasterBranch, true))
  dependsOn:
  # - SonarCloudScan
  - BuildDev
  jobs:
  - deployment: DeployDev
    pool:
      vmImage: ubuntu-20.04
    environment: homeprotection-dev
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: $(devArtifact)
              targetPath: $(Build.ArtifactStagingDirectory)/$(devArtifact)
            displayName: Download Dev artifact
          - task: S3Upload@1
            inputs:
              awsCredentials: $(awsCredentialsDev)
              regionName: $(awsRegion)
              bucketName: $(devBucket)
              targetFolder: $(devArtifact)
              sourceFolder: $(Build.ArtifactStagingDirectory)/$(devArtifact)
            displayName: Upload to Dev S3 bucket
          - task: AWSCLI@1
            displayName: Trigger cache invalidation for the Dev instance
            inputs:
              awsCredentials: $(awsCredentialsDev)
              regionName: $(awsRegion)
              awsCommand: cloudfront
              awsSubCommand: create-invalidation
              awsArguments: "--distribution-id $(devDistribution) --paths \"/*\""
- stage: BuildStage
  condition: eq(variables.isMasterBranch, true)
  # condition: and(succeeded('SonarCloudScan'), eq(variables.isMasterBranch, true))
  # dependsOn:
  # - SonarCloudScan
  jobs:
  - job: BuildStage
    pool:
      vmImage: ubuntu-20.04
    steps:
    - checkout: self
    - checkout: configuration
    - task: NodeTool@0
      displayName: 'Install NodeJS version $(nodeVersion)'
      inputs:
        versionSpec: $(nodeVersion)
    - script: |
        cp $(Agent.BuildDirectory)/s/unify-configs/$(stageConfig) src/environments/environment.prod.ts
        npm install
        ./node_modules/.bin/ng build --prod --aot --build-optimizer
      workingDirectory: $(Agent.BuildDirectory)/s/depp-billing-portal
      displayName: Building stage portal
    - task: CopyFiles@2
      inputs:
        sourceFolder: $(Agent.BuildDirectory)/s/depp-billing-portal/dist/hwa-contractor
        targetFolder: $(Build.ArtifactStagingDirectory)/$(stageArtifact)
      displayName: Copy Stage package
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(stageArtifact)
        artifactName: $(stageArtifact)
      displayName: Publish Stage artifact
- stage: DeployStage
  condition: and(succeeded('BuildStage'), eq(variables.isMasterBranch, true))
  dependsOn:
  # - SonarCloudScan
  - DeployDev
  - BuildStage
  jobs:
  - deployment: DeployStage
    pool:
      vmImage: ubuntu-20.04
    environment: homeprotection-stage
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: $(stageArtifact)
              targetPath: $(Build.ArtifactStagingDirectory)/$(stageArtifact)
            displayName: Download Stage artifact
          - task: S3Upload@1
            inputs:
              awsCredentials: $(awsCredentialsStage)
              regionName: $(awsRegion)
              bucketName: $(stageBucket)
              targetFolder: $(stageArtifact)
              sourceFolder: $(Build.ArtifactStagingDirectory)/$(stageArtifact)
            displayName: Upload to Stage S3 bucket
          - task: AWSCLI@1
            displayName: Trigger cache invalidation for the Stage instance
            inputs:
              awsCredentials: $(awsCredentialsStage)
              regionName: $(awsRegion)
              awsCommand: cloudfront
              awsSubCommand: create-invalidation
              awsArguments: "--distribution-id $(stageDistribution) --paths \"/*\""
- stage: BuildProd
  condition: eq(variables.isMasterBranch, true)
  # condition: and(succeeded('SonarCloudScan'), eq(variables.isMasterBranch, true))
  # dependsOn:
  # - SonarCloudScan
  jobs:
  - job: BuildProd
    pool:
      vmImage: ubuntu-20.04
    steps:
    - checkout: self
    - checkout: configuration
    - task: NodeTool@0
      displayName: 'Install NodeJS version $(nodeVersion)'
      inputs:
        versionSpec: $(nodeVersion)
    - script: |
        cp $(Agent.BuildDirectory)/s/unify-configs/$(prodConfig) src/environments/environment.prod.ts
        npm install
        ./node_modules/.bin/ng build --prod --aot --build-optimizer
      workingDirectory: $(Agent.BuildDirectory)/s/depp-billing-portal
      displayName: Building prod portal
    - task: CopyFiles@2
      inputs:
        sourceFolder: $(Agent.BuildDirectory)/s/depp-billing-portal/dist/hwa-contractor
        targetFolder: $(Build.ArtifactStagingDirectory)/$(prodArtifact)
      displayName: Copy Prod package
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/$(prodArtifact)
        artifactName: $(prodArtifact)
      displayName: Publish Prod artifact
- stage: DeployProd
  condition: and(succeeded('BuildProd'), eq(variables.isMasterBranch, true))
  dependsOn:
  # - SonarCloudScan
  - DeployStage
  - BuildProd
  jobs:
  - deployment: DeployProd
    pool:
      vmImage: ubuntu-20.04
    environment: homeprotection-prod
    strategy:
      runOnce:
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: $(prodArtifact)
              targetPath: $(Build.ArtifactStagingDirectory)/$(prodArtifact)
            displayName: Download Prod artifact
          - task: S3Upload@1
            inputs:
              awsCredentials: $(awsCredentialsProd)
              regionName: $(awsRegion)
              bucketName: $(prodBucket)
              targetFolder: $(prodArtifact)
              sourceFolder: $(Build.ArtifactStagingDirectory)/$(prodArtifact)
            displayName: Upload to Prod S3 bucket
          - task: AWSCLI@1
            displayName: Trigger cache invalidation for the Prod instance
            inputs:
              awsCredentials: $(awsCredentialsProd)
              regionName: $(awsRegion)
              awsCommand: cloudfront
              awsSubCommand: create-invalidation
              awsArguments: "--distribution-id $(prodDistribution) --paths \"/*\""
