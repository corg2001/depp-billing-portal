  devConfig: depp-billing-portal-dev.ts
  devArtifact: depp-billing-portal-dev
  stageBucket: nrg-nrgp-oam-stage-static-assets20230110204625718700000001
  stageDistribution: E2EON3QIOYR7KG
  stageConfig: depp-billing-portal-stage.ts
  stageArtifact: depp-billing-portal-stage
