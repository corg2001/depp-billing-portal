trigger:
  batch: true

variables:
  isQa1Branch: $[eq(variables['Build.SourceBranch'], 'refs/heads/qa1')]
  isQa2Branch: $[eq(variables['Build.SourceBranch'], 'refs/heads/qa2')]
  isQa3Branch: $[eq(variables['Build.SourceBranch'], 'refs/heads/qa3')]
  isMasterBranch: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  sonarCloudProjectKey: CentricaEngineeringServicesNA_depp-billing-portal
  nodeVersion: '8.17.0'
  awsRegion: us-east-1
  awsCredentialsDev: services-hp-prd-aws-dev
  awsCredentialsStage: services-hp-prd-aws-stage
  awsCredentialsProd: services-hp-prd-aws-prod
  devBucket: nrg-nrgp-oam-dev-static-assets20221215183903377400000001
  devDistribution: E2JLHNWE2WMS09
  devConfig: depp-billing-portal-dev.ts
  devArtifact: depp-billing-portal-dev
  stageBucket: nrg-nrgp-oam-stage-static-assets20230110204625718700000001
  stageDistribution: E2EON3QIOYR7KG
  stageConfig: depp-billing-portal-stage.ts
  stageArtifact: depp-billing-portal-stage
  prodBucket: nrg-nrgp-oam-prod-static-assets20230127154237725400000001
  prodDistribution: E19IN3TKYES2EB
  prodConfig: depp-billing-portal-prod.ts
  prodArtifact: depp-billing-portal-prod

resources:
  repositories:
  - repository: configuration
    name: unify-configs
    type: git
    ref: master

stages:
