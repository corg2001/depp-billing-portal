  dev365Distribution: E1ZKBL6R71BEPV
  dev365Config: depp-billing-portal-dev365.ts
  dev365Artifact: depp-billing-portal-dev365
  qa1Bucket: nrg-nrgp-oam-dev-static-assets20221215183903377400000001
  qa1Distribution: E1A3M7TZDZQ2TL
  qa1Config: depp-billing-portal-qa1.ts
  qa1Artifact: depp-billing-portal-qa1
  hf1Bucket: nrg-nrgp-oam-dev-static-assets20221215183903377400000001
  hf1Distribution: E2T7LTQIRL7895
  hf1Config: depp-billing-portal-hf1.ts
  hf1Artifact: depp-billing-portal-hf1
  devBucket: nrg-nrgp-oam-dev-static-assets20221215183903377400000001
